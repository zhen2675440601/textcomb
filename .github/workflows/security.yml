name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install pinned lockfile scanner
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Record RSA feature exposure
        run: cargo tree --locked --workspace --all-features --target all --invert rsa > rsa-dependency-paths.txt 2>&1
      - name: Audit Rust dependencies
        run: cargo audit --json > rust-audit.json
      - name: Retain scan evidence even when vulnerabilities fail the job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-security-${{ github.run_id }}
          path: |
            rust-audit.json
            rsa-dependency-paths.txt
          retention-days: 14
  web:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm audit --audit-level=high --json > npm-audit.json
        working-directory: web
      - name: Retain frontend scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-security-${{ github.run_id }}
          path: web/npm-audit.json
          retention-days: 14
