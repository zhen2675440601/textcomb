name: textcomb

x-app-environment: &app-environment
  TEXTCOMB_DATABASE_URL: postgres://textcomb:${TEXTCOMB_POSTGRES_PASSWORD:?set TEXTCOMB_POSTGRES_PASSWORD}@postgres:5432/textcomb
  TEXTCOMB_MASTER_KEY_BASE64: ${TEXTCOMB_MASTER_KEY_BASE64:?set TEXTCOMB_MASTER_KEY_BASE64}
  TEXTCOMB_STORAGE_DIR: /var/lib/textcomb
  TEXTCOMB_PUBLIC_ORIGIN: ${TEXTCOMB_PUBLIC_ORIGIN:-http://localhost:3000}
  TEXTCOMB_SECURE_COOKIES: ${TEXTCOMB_SECURE_COOKIES:-false}
  TEXTCOMB_LOG: ${TEXTCOMB_LOG:-info,textcomb=debug}
  TEXTCOMB_REPORT_RETENTION_DAYS: ${TEXTCOMB_REPORT_RETENTION_DAYS:-180}
  TEXTCOMB_FAILED_INPUT_RETENTION_HOURS: ${TEXTCOMB_FAILED_INPUT_RETENTION_HOURS:-24}
  TEXTCOMB_JOB_TIMEOUT_MINUTES: ${TEXTCOMB_JOB_TIMEOUT_MINUTES:-120}

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: textcomb
      POSTGRES_USER: textcomb
      POSTGRES_PASSWORD: ${TEXTCOMB_POSTGRES_PASSWORD:?set TEXTCOMB_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U textcomb -d textcomb"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    build:
      context: .
      target: cli
    command: ["migrate"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      <<: *app-environment
      TEXTCOMB_BIND: 0.0.0.0:8080
    volumes:
      - textcomb-data:/var/lib/textcomb
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-environment
      TEXTCOMB_WORKER_CONCURRENCY: ${TEXTCOMB_WORKER_CONCURRENCY:-10}
      TEXTCOMB_PER_JOB_CHUNK_CONCURRENCY: ${TEXTCOMB_PER_JOB_CHUNK_CONCURRENCY:-2}
      TEXTCOMB_MODEL_CONCURRENCY: ${TEXTCOMB_MODEL_CONCURRENCY:-10}
    volumes:
      - textcomb-data:/var/lib/textcomb
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  web:
    build:
      context: web
      args:
        VITE_TEXTCOMB_SOURCE_URL: ${TEXTCOMB_SOURCE_URL:-https://github.com/zhen2675440601/textcomb}
    restart: unless-stopped
    ports:
      - "${TEXTCOMB_HTTP_PORT:-3000}:8080"
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /config:size=16m
      - /data:size=16m
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  cli:
    profiles: ["tools"]
    build:
      context: .
      target: cli
    environment: *app-environment
    volumes:
      - textcomb-data:/var/lib/textcomb
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres-data:
  textcomb-data:

networks:
  frontend:
  backend:
    internal: false
